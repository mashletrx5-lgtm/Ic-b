services:
  - type: web
    name: discord-voice-joiner
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    envVars:
      - key: DISCORD_TOKEN
        sync: false
      - key: VOICE_CHANNEL_ID
        sync: false
      - key: PYTHON_VERSION
        value: "3.12.8"